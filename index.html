<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>นกบินสไตล์มาริโอ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body {
    height:100%;
    background:#1a1a2e;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', Tahoma, sans-serif;
    overflow:hidden;
    touch-action:none;
  }
  #wrap {
    position:relative;
    width:100%;
    max-width:480px;
    border:6px solid #2b2b3d;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.5);
    background:#5c94fc;
    line-height:0;
  }
  canvas {
    display:block;
    width:100%;
    height:auto;
    touch-action:none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
</div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 640;

  // ---------- ค่าคงที่เกม ----------
  const GROUND_H = 90;
  const GRAVITY = 0.55;
  const JUMP = -9.5;
  const BIRD_X = 130;
  const BIRD_R = 17;

  // ---------- สถานะ ----------
  const STATE = { MENU:0, READY:1, PLAY:2, OVER:3 };
  let state = STATE.MENU;

  let bird, pipes, enemies, clouds, score, best, frame;
  let groundShift = 0;
  let readyTimer = 0;
  let autoJumped = false;

  best = parseInt(localStorage.getItem('flappyMarioBest') || '0', 10);

  // ---------- เมฆ ----------
  function initClouds(){
    clouds = [];
    for(let i=0;i<4;i++){
      clouds.push({
        x: Math.random()*W,
        y: 40 + Math.random()*200,
        s: 0.2 + Math.random()*0.3,
        scale: 0.7 + Math.random()*0.6
      });
    }
  }

  function reset(){
    bird = { y: H/2 - 60, vy: 0, rot: 0, wing: 0 };
    pipes = [];
    enemies = [];
    score = 0;
    frame = 0;
    readyTimer = 0;
    autoJumped = false;
    spawnPipe(W + 60);
  }

  // ---------- ระบบความยาก ----------
  function curSpeed(){ return 1.6 + 0.08 * score; }
  function curGap(){ return Math.max(120, 200 - score * 4); }
  function curInterval(){ return Math.max(75, 130 - score * 3); }

  function spawnPipe(px){
    const gap = curGap();
    const minTop = 60;
    const maxTop = H - GROUND_H - gap - 60;
    const topH = minTop + Math.random()*(maxTop - minTop);
    const moving = score >= 6 && Math.random() < 0.55;
    pipes.push({
      x: px,
      top: topH,
      gap: gap,
      passed: false,
      moving: moving,
      baseTop: topH,
      amp: moving ? (20 + Math.random()*45) : 0,
      phase: Math.random()*Math.PI*2,
      freq: 0.015 + Math.random()*0.02
    });
  }

  function spawnEnemy(){
    enemies.push({
      x: W + 30,
      y: 120 + Math.random()*(H - GROUND_H - 240),
      baseY: 0,
      amp: 30 + Math.random()*40,
      phase: Math.random()*Math.PI*2,
      freq: 0.04 + Math.random()*0.02,
      wing: 0
    });
    enemies[enemies.length-1].baseY = enemies[enemies.length-1].y;
  }

  // ---------- อินพุต ----------
  function flap(){
    if(state === STATE.MENU){
      reset();
      state = STATE.READY;
      return;
    }
    if(state === STATE.READY){
      bird.vy = JUMP;
      return;
    }
    if(state === STATE.PLAY){
      bird.vy = JUMP;
      bird.wing = 1;
      return;
    }
    if(state === STATE.OVER){
      reset();
      state = STATE.READY;
      return;
    }
  }

  window.addEventListener('keydown', e=>{
    if(e.code === 'Space'){ e.preventDefault(); flap(); }
  });
  canvas.addEventListener('mousedown', e=>{ e.preventDefault(); flap(); });
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); flap(); }, {passive:false});
  window.addEventListener('touchmove', e=>{ e.preventDefault(); }, {passive:false});

  // ---------- ฟังก์ชันข้อความ (textAlign left เสมอ) ----------
  function drawText(text, x, y, font, fill, align, stroke, strokeW){
    ctx.save();
    ctx.font = font;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    const w = ctx.measureText(text).width;
    let dx = x;
    if(align === 'center') dx = x - w/2;
    else if(align === 'right') dx = x - w;
    if(stroke){
      ctx.lineWidth = strokeW || 4;
      ctx.strokeStyle = stroke;
      ctx.lineJoin = 'round';
      ctx.strokeText(text, dx, y);
    }
    ctx.fillStyle = fill;
    ctx.fillText(text, dx, y);
    ctx.restore();
  }

  // ---------- วาดฉาก ----------
  function drawCloud(c){
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.scale, c.scale);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath();
    ctx.arc(0,0,22,0,Math.PI*2);
    ctx.arc(26,-6,26,0,Math.PI*2);
    ctx.arc(54,2,20,0,Math.PI*2);
    ctx.arc(28,14,24,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawBackground(){
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0,0,W,H);
    for(const c of clouds) drawCloud(c);
  }

  function drawPipeSegment(x, y, w, h, capOnBottom){
    // ตัวท่อ
    const grad = ctx.createLinearGradient(x, 0, x+w, 0);
    grad.addColorStop(0, '#8ed94a');
    grad.addColorStop(0.18, '#bff07a');
    grad.addColorStop(0.45, '#5fb727');
    grad.addColorStop(0.75, '#3d8a18');
    grad.addColorStop(1, '#2a6610');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#1d4a0b';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    // ปากท่อ (lip)
    const lipW = w + 16;
    const lipX = x - 8;
    const lipH = 26;
    const lipY = capOnBottom ? y : (y + h - lipH);
    const lg = ctx.createLinearGradient(lipX, 0, lipX+lipW, 0);
    lg.addColorStop(0, '#9ee65a');
    lg.addColorStop(0.18, '#caf78a');
    lg.addColorStop(0.45, '#62bb2a');
    lg.addColorStop(0.75, '#40901a');
    lg.addColorStop(1, '#2d6c11');
    ctx.fillStyle = lg;
    ctx.fillRect(lipX, lipY, lipW, lipH);
    ctx.strokeStyle = '#1d4a0b';
    ctx.lineWidth = 3;
    ctx.strokeRect(lipX, lipY, lipW, lipH);
  }

  function drawPipe(p){
    const w = 64;
    const x = p.x;
    // ท่อบน
    drawPipeSegment(x, 0, w, p.top, false);
    // ท่อล่าง
    const botY = p.top + p.gap;
    drawPipeSegment(x, botY, w, H - GROUND_H - botY, true);
  }

  function drawGround(){
    const y = H - GROUND_H;
    // แถบหญ้า
    ctx.fillStyle = '#4caf2e';
    ctx.fillRect(0, y, W, 14);
    ctx.fillStyle = '#3a8a22';
    ctx.fillRect(0, y+11, W, 4);
    // ดิน
    ctx.fillStyle = '#d97b3a';
    ctx.fillRect(0, y+14, W, GROUND_H-14);
    // ลายอิฐ
    const bw = 40, bh = 22;
    ctx.strokeStyle = 'rgba(120,55,15,0.55)';
    ctx.lineWidth = 2;
    const off = groundShift % (bw);
    for(let row=0; row*bh < GROUND_H-14; row++){
      const ry = y + 14 + row*bh;
      const rowOff = (row % 2) ? bw/2 : 0;
      for(let bx = -bw; bx < W + bw; bx += bw){
        const px = bx - off + rowOff;
        ctx.strokeRect(px, ry, bw, bh);
      }
    }
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0, y+14, W, 4);
  }

  function drawBird(){
    ctx.save();
    ctx.translate(BIRD_X, bird.y);
    ctx.rotate(bird.rot);

    // ลำตัวสีแดง
    ctx.fillStyle = '#e23b32';
    ctx.beginPath();
    ctx.ellipse(0, 0, BIRD_R+3, BIRD_R, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#8e1d18';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // พุงสีครีม
    ctx.fillStyle = '#fbe6b8';
    ctx.beginPath();
    ctx.ellipse(2, 6, BIRD_R-4, BIRD_R-7, 0, 0, Math.PI*2);
    ctx.fill();

    // ปีกกระพือ
    const wingUp = Math.sin(bird.wing * Math.PI);
    ctx.fillStyle = '#c22d25';
    ctx.strokeStyle = '#8e1d18';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(-6, 2, 11, 7, -0.5 - wingUp*0.6, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // ตา
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(10, -6, 7, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(12, -6, 3.2, 0, Math.PI*2);
    ctx.fill();

    // คิ้วดุ
    ctx.strokeStyle = '#5a1410';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(3, -14);
    ctx.lineTo(16, -10);
    ctx.stroke();

    // ปากสีส้ม
    ctx.fillStyle = '#ff9a1f';
    ctx.strokeStyle = '#cc6f00';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(17, -2);
    ctx.lineTo(30, 1);
    ctx.lineTo(17, 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function drawEnemy(e){
    ctx.save();
    ctx.translate(e.x, e.y);
    const wingUp = Math.sin(e.wing * Math.PI * 2);

    // ปีก
    ctx.fillStyle = '#7a3fb5';
    ctx.strokeStyle = '#4d1f7a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(-2, -4, 14, 8, -0.4 - wingUp*0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(-2, 4, 14, 8, 0.4 + wingUp*0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // ลำตัวม่วง
    ctx.fillStyle = '#9b4dca';
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#4d1f7a';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // ตาขุ่น
    ctx.fillStyle = '#d9c8e8';
    ctx.beginPath();
    ctx.arc(-5, -3, 5, 0, Math.PI*2);
    ctx.arc(6, -3, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#3a2050';
    ctx.beginPath();
    ctx.arc(-5, -2, 2.2, 0, Math.PI*2);
    ctx.arc(6, -2, 2.2, 0, Math.PI*2);
    ctx.fill();

    // ปากบึ้ง
    ctx.strokeStyle = '#3a2050';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 10, 5, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();

    ctx.restore();
  }

  function drawScore(){
    drawText(String(score), W-18, 50, 'bold 40px Tahoma', '#fff', 'right', '#000', 5);
    drawText('สูงสุด ' + best, W-18, 80, 'bold 18px Tahoma', '#ffe27a', 'right', '#000', 4);
  }

  // ---------- พาเนล ----------
  function drawPanel(cx, cy, pw, ph){
    const px = cx - pw/2, py = cy - ph/2, r = 16;
    ctx.save();
    ctx.fillStyle = 'rgba(20,20,40,0.82)';
    ctx.strokeStyle = '#ffe27a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(px+r, py);
    ctx.arcTo(px+pw, py, px+pw, py+ph, r);
    ctx.arcTo(px+pw, py+ph, px, py+ph, r);
    ctx.arcTo(px, py+ph, px, py, r);
    ctx.arcTo(px, py, px+pw, py, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawMenu(){
    const cx = W/2, cy = H/2 - 30;
    const pw = 340, ph = 220;
    drawPanel(cx, cy, pw, ph);
    drawText('นกบินสไตล์มาริโอ', cx, cy - 55, 'bold 30px Tahoma', '#ffe27a', 'center', '#000', 5);
    drawText('แตะ คลิก หรือกด Space', cx, cy - 5, 'bold 19px Tahoma', '#fff', 'center', '#000', 4);
    drawText('เพื่อเริ่มเล่น', cx, cy + 25, 'bold 19px Tahoma', '#fff', 'center', '#000', 4);
    drawText('สูงสุด: ' + best, cx, cy + 70, 'bold 22px Tahoma', '#9be86a', 'center', '#000', 4);
  }

  function drawReadyHint(){
    drawText('แตะเพื่อกระโดด!', W/2, 160, 'bold 24px Tahoma', '#fff', 'center', '#000', 5);
  }

  function drawOver(){
    const cx = W/2, cy = H/2 - 30;
    const pw = 340, ph = 250;
    drawPanel(cx, cy, pw, ph);
    drawText('จบเกม', cx, cy - 70, 'bold 36px Tahoma', '#ff6b5e', 'center', '#000', 5);
    drawText('คะแนน: ' + score, cx, cy - 15, 'bold 26px Tahoma', '#fff', 'center', '#000', 4);
    drawText('สูงสุด: ' + best, cx, cy + 25, 'bold 26px Tahoma', '#ffe27a', 'center', '#000', 4);
    drawText('แตะเพื่อเล่นใหม่', cx, cy + 80, 'bold 20px Tahoma', '#9be86a', 'center', '#000', 4);
  }

  // ---------- อัปเดต ----------
  function update(){
    frame++;
    // เมฆลอย
    for(const c of clouds){
      c.x -= c.s;
      if(c.x < -90) { c.x = W + 60; c.y = 40 + Math.random()*200; }
    }

    if(state === STATE.PLAY){
      groundShift += curSpeed();
    } else if(state === STATE.READY){
      groundShift += 1.2;
    } else if(state === STATE.MENU){
      groundShift += 0.8;
    }

    if(state === STATE.READY){
      readyTimer++;
      // ลอยนิ่งเบาๆ
      bird.y += Math.sin(frame*0.1) * 0.4;
      if(readyTimer > 48 && !autoJumped){
        bird.vy = JUMP;
        autoJumped = true;
        state = STATE.PLAY;
      }
    }

    if(state === STATE.PLAY){
      const speed = curSpeed();

      // นก
      bird.vy += GRAVITY;
      bird.y += bird.vy;
      if(bird.wing > 0){ bird.wing += 0.15; if(bird.wing >= 1) bird.wing = 0; }
      bird.rot = Math.max(-0.5, Math.min(1.4, bird.vy * 0.06));

      // เพดาน
      if(bird.y < BIRD_R){ bird.y = BIRD_R; bird.vy = 0; }

      // ท่อ
      for(const p of pipes){
        p.x -= speed;
        if(p.moving){
          p.top = p.baseTop + Math.sin(frame*p.freq + p.phase)*p.amp;
        }
        if(!p.passed && p.x + 64 < BIRD_X){
          p.passed = true;
          score++;
          if(score > best){ best = score; localStorage.setItem('flappyMarioBest', String(best)); }
        }
      }
      pipes = pipes.filter(p => p.x > -90);

      // เกิดท่อใหม่
      const last = pipes[pipes.length-1];
      if(!last || (W - last.x) >= curInterval()){
        spawnPipe(W + 40);
      }

      // ศัตรู
      if(score >= 10 && frame % 110 === 0){
        spawnEnemy();
      }
      for(const e of enemies){
        e.x -= speed * 1.25;
        e.y = e.baseY + Math.sin(frame*e.freq + e.phase)*e.amp;
        e.wing += 0.12; if(e.wing >= 1) e.wing = 0;
      }
      enemies = enemies.filter(e => e.x > -40);

      // ชนพื้น
      if(bird.y + BIRD_R >= H - GROUND_H){
        bird.y = H - GROUND_H - BIRD_R;
        gameOver();
      }

      // ชนท่อ
      for(const p of pipes){
        const w = 64;
        if(BIRD_X + BIRD_R - 4 > p.x && BIRD_X - BIRD_R + 4 < p.x + w){
          if(bird.y - BIRD_R + 4 < p.top || bird.y + BIRD_R - 4 > p.top + p.gap){
            gameOver();
          }
        }
      }

      // ชนศัตรู
      for(const e of enemies){
        const dx = (BIRD_X) - e.x, dy = bird.y - e.y;
        if(Math.hypot(dx, dy) < BIRD_R + 13){
          gameOver();
        }
      }
    }
  }

  function gameOver(){
    if(state !== STATE.PLAY) return;
    state = STATE.OVER;
    if(score > best){ best = score; localStorage.setItem('flappyMarioBest', String(best)); }
  }

  // ---------- เรนเดอร์ ----------
  function render(){
    drawBackground();
    for(const p of pipes) drawPipe(p);
    for(const e of enemies) drawEnemy(e);
    drawGround();
    drawBird();
    drawScore();

    if(state === STATE.MENU) drawMenu();
    else if(state === STATE.READY) drawReadyHint();
    else if(state === STATE.OVER) drawOver();
  }

  function loop(){
    update();
    render();
    requestAnimationFrame(loop);
  }

  // ---------- เริ่ม ----------
  initClouds();
  reset();
  state = STATE.MENU;
  loop();
})();
</script>
</body>
</html>
