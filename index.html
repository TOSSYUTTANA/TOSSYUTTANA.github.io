<div style="display:flex;justify-content:center;padding:1rem 0;">
<div id="wrap" style="position:relative;width:100%;max-width:480px;touch-action:none;user-select:none;-webkit-user-select:none;">
  <canvas id="game" width="480" height="640" style="display:block;width:100%;height:auto;border:4px solid #1a1a2e;border-radius:8px;touch-action:none;"></canvas>
  <div id="hud" style="position:absolute;top:14px;right:18px;text-align:right;pointer-events:none;font-family:'Trebuchet MS',sans-serif;">
    <div id="score" style="font-size:28px;font-weight:800;color:#fff;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;">0</div>
    <div id="best" style="font-size:14px;font-weight:700;color:#ffe0a0;text-shadow:1px 1px 0 #000;">BEST 0</div>
  </div>
  <div id="overlay" style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.45);color:#fff;text-align:center;border-radius:8px;gap:14px;font-family:'Trebuchet MS',sans-serif;">
    <h1 style="font-size:38px;text-shadow:3px 3px 0 #000;margin:0;color:#fff;">ANGRY BIRD</h1>
    <p style="font-size:18px;text-shadow:2px 2px 0 #000;margin:0;">แตะหน้าจอ / กด SPACE เพื่อกระโดด<br>หลบท่อและศัตรูให้ได้!</p>
    <button id="startBtn" style="margin-top:8px;padding:12px 28px;font-size:18px;font-weight:700;color:#fff;background:#e52521;border:3px solid #fff;border-radius:8px;cursor:pointer;box-shadow:0 4px 0 #a31410;font-family:'Trebuchet MS',sans-serif;">เริ่มเกม</button>
  </div>
</div>
</div>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

// ---- ฟิสิกส์หนักขึ้น ----
const GRAVITY = 0.55, FLAP = -9.5, PIPE_W = 70;
const GROUND_H = 60;
const START_DELAY = 50;

let best = 0;
try { best = parseInt(localStorage.getItem('ab_best') || '0') || 0; } catch(e) {}
bestEl.textContent = 'BEST ' + best;

// ---- ความยากปรับตามคะแนน (ไม่มีเพดานสำหรับความเร็ว) ----
function difficulty() {
  const t = Math.min(score / 25, 1);
  return {
    gap: 280 - 110 * t,                 // ช่องว่างแคบลง
    speed: 1.6 + 0.08 * score,          // เร็วขึ้นเรื่อยๆ ไม่มีเพดาน
    interval: Math.max(60, Math.round(150 - 4 * score)),
    moving: score >= 6,                 // ท่อเริ่มขยับขึ้นลงหลังคะแนน 6
    enemies: score >= 10                // ศัตรูเริ่มโผล่หลังคะแนน 10
  };
}

let bird, pipes, enemies, score, frame, state;

function reset() {
  bird = { x: 120, y: H/2, r: 16, vy: 0 };
  pipes = []; enemies = []; score = 0; frame = 0;
  scoreEl.textContent = '0';
}
function spawnPipe() {
  const d = difficulty();
  const minTop = 60, maxTop = H - GROUND_H - d.gap - 60;
  const top = minTop + Math.random() * (maxTop - minTop);
  const move = d.moving && Math.random() < 0.55;
  pipes.push({
    x: W, top, gap: d.gap, scored: false,
    baseTop: top, amp: move ? 40 + Math.random()*50 : 0,
    phase: Math.random()*Math.PI*2, vmove: 0.03 + Math.random()*0.02
  });
}
function spawnEnemy() {
  const y = 90 + Math.random() * (H - GROUND_H - 180);
  enemies.push({ x: W + 20, y, r: 14, phase: Math.random()*Math.PI*2 });
}
function flap() { if (state === 'play') bird.vy = FLAP; }
function start() {
  reset(); state = 'play'; bird.vy = FLAP;
  overlay.style.display = 'none';
}
function gameOver() {
  state = 'over';
  if (score > best) {
    best = score;
    try { localStorage.setItem('ab_best', String(best)); } catch(e) {}
  }
  bestEl.textContent = 'BEST ' + best;
  overlay.style.display = 'flex';
  overlay.querySelector('h1').textContent = 'GAME OVER';
  overlay.querySelector('p').innerHTML = 'คะแนน: <b>' + score + '</b><br>สูงสุด: <b>' + best + '</b>';
  startBtn.textContent = 'เล่นอีกครั้ง';
}
function drawCloud(x, y, s) {
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x, y, 14*s, 0, 7); ctx.arc(x+16*s, y-6*s, 18*s, 0, 7);
  ctx.arc(x+34*s, y, 14*s, 0, 7); ctx.fill();
}
function drawBg() {
  ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, W, H);
  drawCloud(80, 110, 1); drawCloud(330, 70, 0.8); drawCloud(220, 200, 0.6);
}
function drawPipe(p) {
  const bottomY = p.top + p.gap;
  ctx.fillStyle = '#00a800';
  ctx.fillRect(p.x, 0, PIPE_W, p.top);
  ctx.fillRect(p.x, bottomY, PIPE_W, H - GROUND_H - bottomY);
  ctx.fillStyle = '#3ce53c';
  ctx.fillRect(p.x+6, 0, 8, p.top);
  ctx.fillRect(p.x+6, bottomY, 8, H - GROUND_H - bottomY);
  ctx.fillStyle = '#007000';
  ctx.fillRect(p.x+PIPE_W-10, 0, 10, p.top);
  ctx.fillRect(p.x+PIPE_W-10, bottomY, 10, H - GROUND_H - bottomY);
  ctx.fillStyle = '#00a800';
  ctx.fillRect(p.x-6, p.top-28, PIPE_W+12, 28);
  ctx.fillRect(p.x-6, bottomY, PIPE_W+12, 28);
  ctx.strokeStyle = '#004d00'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x-6, p.top-28, PIPE_W+12, 28);
  ctx.strokeRect(p.x-6, bottomY, PIPE_W+12, 28);
}
function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  // ตัวศัตรู (สีม่วงมีปีกขยับ)
  const wing = Math.sin(frame*0.3 + e.phase) * 6;
  ctx.fillStyle = '#6b3fa0';
  ctx.beginPath(); ctx.moveTo(-e.r, 0); ctx.lineTo(-e.r-10, -wing-4); ctx.lineTo(-e.r-4, 0); ctx.fill();
  ctx.beginPath(); ctx.moveTo(e.r, 0); ctx.lineTo(e.r+10, -wing-4); ctx.lineTo(e.r+4, 0); ctx.fill();
  ctx.fillStyle = '#8a52cf';
  ctx.beginPath(); ctx.arc(0, 0, e.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-5, -3, 4, 0, 7); ctx.arc(5, -3, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-5, -3, 2, 0, 7); ctx.arc(5, -3, 2, 0, 7); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 6, 5, 3.4, 6.0); ctx.stroke(); // ปากบึ้ง
  ctx.restore();
}
function drawGround() {
  const gy = H - GROUND_H;
  ctx.fillStyle = '#e09b3d'; ctx.fillRect(0, gy, W, GROUND_H);
  ctx.fillStyle = '#c97b1f';
  for (let i = 0; i < W; i += 32) ctx.fillRect(i + (frame % 32) * -1 + 32, gy, 16, 16);
  ctx.fillStyle = '#5ab552'; ctx.fillRect(0, gy, W, 10);
}
function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(Math.max(-0.5, Math.min(1.2, bird.vy/10)));
  ctx.fillStyle = '#e52521';
  ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffe0a0';
  ctx.beginPath(); ctx.arc(2, 4, bird.r*0.6, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -5, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(8, -5, 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff9100';
  ctx.beginPath(); ctx.moveTo(bird.r-2, 0); ctx.lineTo(bird.r+10, 3);
  ctx.lineTo(bird.r-2, 7); ctx.fill();
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(11, -7); ctx.stroke();
  ctx.restore();
}
function collidePipe(p) {
  const bx = bird.x, by = bird.y, r = bird.r;
  if (bx + r > p.x && bx - r < p.x + PIPE_W) {
    if (by - r < p.top || by + r > p.top + p.gap) return true;
  }
  return false;
}
function collideEnemy(e) {
  const dx = bird.x - e.x, dy = bird.y - e.y;
  return Math.hypot(dx, dy) < bird.r + e.r - 3;
}
function loop() {
  if (state === 'play') {
    frame++;
    if (frame < START_DELAY) {
      drawBg(); drawGround(); drawBird();
      requestAnimationFrame(loop); return;
    }
    bird.vy += GRAVITY; bird.y += bird.vy;
    const d = difficulty();
    if ((frame - START_DELAY) % d.interval === 0) spawnPipe();
    if (d.enemies && (frame - START_DELAY) % Math.max(90, 220 - 5*score) === 0) spawnEnemy();

    pipes.forEach(p => {
      p.x -= d.speed;
      if (p.amp) p.top = p.baseTop + Math.sin(frame * p.vmove + p.phase) * p.amp;
    });
    enemies.forEach(e => {
      e.x -= d.speed * 1.15;
      e.y += Math.sin(frame*0.05 + e.phase) * 1.2;
    });
    pipes = pipes.filter(p => p.x + PIPE_W > -20);
    enemies = enemies.filter(e => e.x > -30);

    for (const p of pipes) {
      if (collidePipe(p)) { gameOver(); break; }
      if (!p.scored && p.x + PIPE_W < bird.x) {
        p.scored = true; score++; scoreEl.textContent = score;
      }
    }
    if (state === 'play') for (const e of enemies) { if (collideEnemy(e)) { gameOver(); break; } }
    if (bird.y + bird.r > H - GROUND_H) { bird.y = H - GROUND_H - bird.r; gameOver(); }
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
  }
  drawBg(); pipes.forEach(drawPipe); enemies.forEach(drawEnemy); drawGround(); drawBird();
  requestAnimationFrame(loop);
}
function tap() { if (state === 'play') flap(); else start(); }
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); tap(); } });
cv.addEventListener('mousedown', e => { e.preventDefault(); if (state === 'play') flap(); });
cv.addEventListener('touchstart', e => { e.preventDefault(); tap(); }, { passive: false });
startBtn.addEventListener('click', e => { e.preventDefault(); start(); });
startBtn.addEventListener('touchstart', e => { e.preventDefault(); start(); }, { passive: false });
reset(); state = 'ready'; loop();
</script>
